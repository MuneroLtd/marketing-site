name: Deploy to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Sync to S3
        run: |
          aws s3 sync . s3://munero.co.uk/ \
            --exclude "*" \
            --include "index.html" \
            --include "styles.css" \
            --include "assets/*" \
            --delete

      - name: Set cache headers
        run: |
          # HTML - no cache
          aws s3 cp s3://munero.co.uk/index.html \
            s3://munero.co.uk/index.html \
            --metadata-directive REPLACE \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

          # CSS - cache for 7 days
          aws s3 cp s3://munero.co.uk/styles.css \
            s3://munero.co.uk/styles.css \
            --metadata-directive REPLACE \
            --cache-control "public, max-age=604800" \
            --content-type "text/css"

          # Assets - cache for 30 days.
          # Per type, not one blanket --recursive pass: REPLACE drops the
          # content type the sync inferred, and re-copying without setting it
          # again leaves every asset as binary/octet-stream. Browsers sniff
          # PNG/JPEG bytes so those still render, but an SVG in an <img> is
          # never sniffed -- it just fails to paint.
          for spec in "png:image/png" "svg:image/svg+xml" "jpg:image/jpeg" "webp:image/webp"; do
            ext="${spec%%:*}"
            type="${spec#*:}"
            aws s3 cp s3://munero.co.uk/assets/ \
              s3://munero.co.uk/assets/ \
              --recursive \
              --exclude "*" \
              --include "*.${ext}" \
              --metadata-directive REPLACE \
              --cache-control "public, max-age=2592000, immutable" \
              --content-type "${type}"
          done
