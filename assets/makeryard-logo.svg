<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Makeryard">
  <!--
    The Makeryard mark, from https://makeryard.app/favicon.svg.

    The upstream asset themes itself with a prefers-color-scheme media query,
    because it is served onto a surface that follows the OS. This site does not:
    it is dark at every colour scheme. So the ink is pinned to the light-on-dark
    value the upstream asset resolves to on a dark surface — left self-theming it
    would paint indigo ink (#212A72, about 1.3:1 here) on the dark product card
    for every visitor whose OS is set to light.
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#EEF0FA" stroke-width="6"
          d="M14 16 L8 22 L8 42 L32 53 L56 42 L56 22 L50 16" />
    <rect x="25" y="26" width="14" height="14" rx="3"
          stroke="#F1930C" stroke-width="5" />
  </g>
</svg>
